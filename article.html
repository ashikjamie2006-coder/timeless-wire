<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Timeless Wire — Dispatch</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            masthead: ['Cinzel', 'serif'],
            serif: ['Newsreader', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            crimson: { 600: '#991B1B', 700: '#7F1D1D' }
          }
        }
      }
    }
  </script>
  <style>
    .font-masthead { font-family: 'Cinzel', serif; }
    .font-serif { font-family: 'Newsreader', Georgia, serif; }
    .font-sans { font-family: 'Inter', sans-serif; }
    
    /* Editorial Typography & Drop Caps */
    .article-body p.lead::first-letter {
      float: left;
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      line-height: 3.5rem;
      padding-top: 4px;
      padding-right: 12px;
      padding-bottom: 4px;
      font-weight: 700;
      color: #991B1B;
    }
    .dark .article-body p.lead::first-letter {
      color: #EF4444;
    }
    .article-body p {
      margin-bottom: 1.5rem;
      line-height: 1.85;
      font-size: 1.15rem;
    }
    .article-body h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #E5E7EB;
      padding-bottom: 0.5rem;
    }
    .dark .article-body h2 {
      border-color: #27272A;
    }
    .article-body blockquote {
      border-left: 3px solid #991B1B;
      padding-left: 1.5rem;
      font-style: italic;
      font-size: 1.25rem;
      margin: 2rem 0;
      color: #4B5563;
    }
    .dark .article-body blockquote {
      border-color: #EF4444;
      color: #D1D5DB;
    }
  </style>
</head>
<body class="bg-[#FAF8F5] dark:bg-[#121110] text-zinc-900 dark:text-zinc-100 font-sans transition-colors duration-200 min-h-screen flex flex-col">

  <!-- TOP BAR -->
  <div class="border-b border-zinc-200 dark:border-zinc-800 bg-[#F4EFEA] dark:bg-[#1A1816] text-xs py-2 px-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="index.html" class="font-masthead font-bold tracking-wider hover:text-crimson-600 dark:hover:text-red-400 flex items-center gap-1.5">
        ← TIMELESS WIRE
      </a>
      <div class="flex items-center gap-4">
        <button id="themeToggle" class="hover:text-zinc-900 dark:hover:text-white">
          <span id="themeIcon">🌙</span> Theme
        </button>
        <a href="admin.html" class="text-zinc-500 hover:text-zinc-900 dark:hover:text-white">Dashboard</a>
      </div>
    </div>
  </div>

  <!-- ARTICLE READER MAIN -->
  <main class="max-w-3xl mx-auto px-4 py-10 flex-1 w-full">
    <div id="articleContent">
      <div class="animate-pulse space-y-4">
        <div class="h-4 bg-zinc-200 dark:bg-zinc-800 rounded w-1/4"></div>
        <div class="h-10 bg-zinc-200 dark:bg-zinc-800 rounded w-3/4"></div>
        <div class="h-64 bg-zinc-200 dark:bg-zinc-800 rounded"></div>
      </div>
    </div>

    <!-- NATIVE READER DISCUSSION & COMMENTARY (100% SAFE & PRIVATE) -->
    <section class="border-t-2 border-zinc-900 dark:border-zinc-700 mt-16 pt-10" id="commentsSection">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <span class="text-xs uppercase tracking-widest font-bold text-crimson-600 dark:text-red-400 block mb-1">Public Forum</span>
          <h3 class="font-masthead text-xl font-bold uppercase tracking-wide text-zinc-950 dark:text-zinc-50">
            Reader Commentary (<span id="commentCount">0</span>)
          </h3>
        </div>
        <div class="text-xs text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 px-3 py-1.5 rounded-full border border-emerald-200 dark:border-emerald-800 flex items-center gap-1.5">
          <span>🔒 Safe & Private • No Login Required</span>
        </div>
      </div>

      <!-- ADD COMMENT FORM -->
      <form id="commentForm" class="bg-white dark:bg-zinc-900 p-6 rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-sm mb-8 space-y-4">
        <h4 class="font-serif text-base font-bold text-zinc-900 dark:text-zinc-100">Join the Conversation</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input 
            type="text" 
            id="commentAuthor" 
            required 
            placeholder="Your Name / Handle" 
            class="text-xs sm:text-sm px-3.5 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 focus:outline-none focus:ring-1 focus:ring-zinc-900"
          >
          <input 
            type="text" 
            id="commentRole" 
            placeholder="Affiliation / Title (optional)" 
            class="text-xs sm:text-sm px-3.5 py-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 focus:outline-none focus:ring-1 focus:ring-zinc-900"
          >
        </div>
        <textarea 
          id="commentContent" 
          rows="3" 
          required 
          placeholder="Share your perspectives, historical notes, or commentary on this dispatch..." 
          class="w-full text-xs sm:text-sm font-serif px-3.5 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 focus:outline-none focus:ring-1 focus:ring-zinc-900"
        ></textarea>
        <div class="flex justify-between items-center pt-1">
          <span class="text-[11px] text-zinc-400">Respectful discourse is preserved on the wire.</span>
          <button 
            type="submit" 
            class="px-5 py-2 text-xs font-semibold rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 hover:bg-zinc-800 transition"
          >
            Post Comment
          </button>
        </div>
      </form>

      <!-- COMMENT LIST -->
      <div id="commentsList" class="space-y-4">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- RELATED DISPATCHES -->
    <div class="border-t-2 border-zinc-900 dark:border-zinc-700 mt-16 pt-8">
      <h3 class="font-masthead text-lg font-bold uppercase tracking-wider mb-6">Related Dispatches</h3>
      <div id="relatedGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-zinc-200 dark:border-zinc-800 bg-[#F4EFEA] dark:bg-[#161413] py-8 px-4 text-xs text-center text-zinc-500">
    <p class="font-masthead font-semibold text-zinc-700 dark:text-zinc-300">TIMELESS WIRE</p>
    <p class="mt-1">Stories, History, Markets & News © 2026</p>
  </footer>

  <script type="module">
    import { getArticleById, getArticles, getComments, addComment } from "./js/store.js";

    // Theme Toggle
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    if (localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
      themeIcon.textContent = "☀️";
    }
    themeToggle.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");
      const isDark = document.documentElement.classList.contains("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      themeIcon.textContent = isDark ? "☀️" : "🌙";
    });

    // Load Article
    const params = new URLSearchParams(window.location.search);
    let id = params.get("id");
    const allArticles = getArticles();
    let article = id ? getArticleById(id) : null;

    // Smart Fallback: If no article ID is in URL, automatically load the featured lead story
    if (!article && allArticles.length > 0) {
      article = allArticles.find(a => a.featured) || allArticles[0];
    }

    const container = document.getElementById("articleContent");
    if (!article) {
      container.innerHTML = `
        <div class="text-center py-20">
          <h1 class="font-serif text-3xl font-bold mb-3">Dispatch Not Found</h1>
          <p class="text-zinc-500 mb-6">No dispatches are currently available on the wire.</p>
          <a href="index.html" class="px-5 py-2.5 rounded-lg bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 font-semibold text-sm">Return to Front Page</a>
        </div>
      `;
    } else {
      document.title = `${article.title} — Timeless Wire`;
      
      container.innerHTML = `
        <article>
          <!-- Metadata Header -->
          <div class="mb-6">
            <a href="index.html" class="inline-block text-xs uppercase tracking-widest font-bold text-crimson-600 dark:text-red-400 mb-3 hover:underline">
              ← ${article.category}
            </a>
            <h1 class="font-serif text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-zinc-950 dark:text-zinc-50 leading-tight mb-4">
              ${article.title}
            </h1>
            <p class="text-lg sm:text-xl font-serif italic text-zinc-600 dark:text-zinc-300 mb-6">
              ${article.excerpt}
            </p>
            <div class="flex items-center justify-between py-3 border-y border-zinc-200 dark:border-zinc-800 text-xs sm:text-sm text-zinc-500">
              <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-full bg-crimson-600 text-white font-bold flex items-center justify-center font-masthead text-xs">
                  ${article.author.charAt(0)}
                </div>
                <div>
                  <div class="font-semibold text-zinc-900 dark:text-zinc-100">${article.author}</div>
                  <div class="text-xs text-zinc-400">Staff Correspondent</div>
                </div>
              </div>
              <div class="text-right">
                <div>${article.date}</div>
                <div class="text-xs text-zinc-400">${article.readTime}</div>
              </div>
            </div>
          </div>

          <!-- Cover Image -->
          <div class="rounded-2xl overflow-hidden mb-10 shadow-sm border border-zinc-200 dark:border-zinc-800">
            <img src="${article.coverImage}" alt="${article.title}" class="w-full max-h-[460px] object-cover">
          </div>

          <!-- Body Content -->
          <div class="article-body font-serif text-zinc-800 dark:text-zinc-200">
            ${article.content}
          </div>

          <!-- Share Actions -->
          <div class="mt-12 p-4 rounded-xl bg-[#F4EFEA] dark:bg-[#1A1816] border border-zinc-200 dark:border-zinc-800 flex flex-wrap items-center justify-between gap-3 text-xs">
            <span class="font-semibold text-zinc-700 dark:text-zinc-300">Share this dispatch:</span>
            <div class="flex items-center gap-2">
              <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link copied to clipboard!');" class="px-3 py-1.5 rounded-md bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition">
                📋 Copy Link
              </button>
              <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(article.title)}&url=${encodeURIComponent(window.location.href)}" target="_blank" class="px-3 py-1.5 rounded-md bg-white dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-700 transition">
                𝕏 Post
              </a>
            </div>
          </div>
        </article>
      `;

      // Render Reader Comments (Native, Private, 100% Safe)
      function renderComments() {
        const comments = getComments(article.id);
        const countSpan = document.getElementById("commentCount");
        if (countSpan) countSpan.textContent = comments.length;
        const list = document.getElementById("commentsList");
        if (!list) return;

        if (comments.length === 0) {
          list.innerHTML = `
            <div class="text-center py-8 text-zinc-400 text-xs">
              No comments yet on this dispatch. Be the first to share your perspective!
            </div>
          `;
          return;
        }

        list.innerHTML = comments.map(c => `
          <div class="p-4 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-xs">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-2.5">
                <div class="h-7 w-7 rounded-full bg-crimson-600 text-white font-bold text-xs flex items-center justify-center font-masthead">
                  ${c.author.charAt(0).toUpperCase()}
                </div>
                <div>
                  <span class="font-semibold text-xs sm:text-sm text-zinc-900 dark:text-zinc-100">${c.author}</span>
                </div>
              </div>
              <span class="text-[11px] text-zinc-400">${c.date}</span>
            </div>
            <p class="text-xs sm:text-sm text-zinc-700 dark:text-zinc-300 font-serif leading-relaxed pl-9">
              ${c.content}
            </p>
          </div>
        `).join("");
      }

      renderComments();

      // Comment Form Submission
      const commentForm = document.getElementById("commentForm");
      if (commentForm) {
        commentForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const author = document.getElementById("commentAuthor").value.trim();
          const role = document.getElementById("commentRole").value.trim();
          const content = document.getElementById("commentContent").value.trim();

          if (!author || !content) return;

          addComment(article.id, {
            author: role ? `${author} (${role})` : author,
            content
          });

          commentForm.reset();
          renderComments();
        });
      }

      // Render Related Articles
      const related = getArticles()
        .filter(a => a.id !== article.id && (a.category === article.category || a.featured))
        .slice(0, 2);

      document.getElementById("relatedGrid").innerHTML = related.map(rel => `
        <a href="article.html?id=${rel.id}" class="group block p-4 rounded-xl bg-white dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-800 hover:shadow-md transition">
          <span class="text-xs uppercase tracking-wider font-semibold text-crimson-600 dark:text-red-400 block mb-1">${rel.category}</span>
          <h4 class="font-serif font-bold text-zinc-900 dark:text-zinc-100 group-hover:text-crimson-600 dark:group-hover:text-red-400 transition mb-2">
            ${rel.title}
          </h4>
          <span class="text-xs text-zinc-400">${rel.readTime} • ${rel.date}</span>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
