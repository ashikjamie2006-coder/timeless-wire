<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#18181B"/>
  <!-- Broadsheet Newspaper Icon -->
  <rect x="15" y="14" width="34" height="36" rx="2" fill="#FAF8F5"/>
  <!-- Masthead Banner -->
  <rect x="18" y="17" width="28" height="5" fill="#991B1B"/>
  <!-- Story Image Block -->
  <rect x="18" y="25" width="13" height="13" fill="#27272A" rx="1"/>
  <!-- Headline & Text Columns -->
  <line x1="34" y1="26" x2="43" y2="26" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="30" x2="43" y2="30" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="34" x2="43" y2="34" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="38" x2="43" y2="38" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bottom Rules -->
  <line x1="18" y1="42" x2="46" y2="42" stroke="#D4D4D8" stroke-width="1"/>
  <line x1="18" y1="45" x2="46" y2="45" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round"/>
</svg>
